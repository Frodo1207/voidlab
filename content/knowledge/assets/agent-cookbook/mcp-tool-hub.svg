  <path d="M226 430V404" stroke="#CBC2B4" stroke-width="4" stroke-linecap="round"/>
  <path d="M462 430V404" stroke="#CBC2B4" stroke-width="4" stroke-linecap="round"/>
  <path d="M738 430V404" stroke="#CBC2B4" stroke-width="4" stroke-linecap="round"/>
  <path d="M974 430V404" stroke="#CBC2B4" stroke-width="4" stroke-linecap="round"/>

  <rect x="84" y="604" width="1032" height="60" rx="18" fill="#F4F0E7" stroke="#E1D8C8"/>
  <text x="116" y="642" fill="#5F5A51" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20">有了统一接法，大脑不需要为每个工具都重新学一遍“怎么说话”。</text>
