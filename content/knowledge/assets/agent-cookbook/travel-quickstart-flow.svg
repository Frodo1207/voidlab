<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="720" fill="#F6F3EC"/>
  <rect x="48" y="40" width="1104" height="640" rx="28" fill="#FFFDF8" stroke="#E7E0D4" stroke-width="2"/>
  <text x="84" y="108" fill="#171717" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="36" font-weight="700">先跑起来的最短路径</text>
  <text x="84" y="146" fill="#6B665C" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="22">先启动后端，再开前端，最后从首页提一遍表单，把整条链路走通。</text>

  <rect x="110" y="260" width="250" height="120" rx="24" fill="#FFFDF8" stroke="#D8CFBF" stroke-width="2"/>
  <rect x="110" y="260" width="10" height="120" rx="5" fill="#C4F000"/>
  <text x="150" y="316" fill="#171717" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700">1. 启动后端</text>
  <text x="150" y="350" fill="#5F5A51" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20">先看接口和文档能不能开</text>

  <rect x="475" y="260" width="250" height="120" rx="24" fill="#FFFDF8" stroke="#D8CFBF" stroke-width="2"/>
  <rect x="475" y="260" width="10" height="120" rx="5" fill="#99D200"/>
  <text x="515" y="316" fill="#171717" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700">2. 启动前端</text>
  <text x="515" y="350" fill="#5F5A51" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20">确认页面和表单能加载</text>

  <rect x="840" y="260" width="250" height="120" rx="24" fill="#FFFDF8" stroke="#D8CFBF" stroke-width="2"/>
  <rect x="840" y="260" width="10" height="120" rx="5" fill="#72C000"/>
  <text x="880" y="316" fill="#171717" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700">3. 走完整链路</text>
  <text x="880" y="350" fill="#5F5A51" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20">提交表单直到结果页出来</text>

  <path d="M360 320H475" stroke="#CBC2B4" stroke-width="4" stroke-linecap="round"/>
  <path d="M725 320H840" stroke="#CBC2B4" stroke-width="4" stroke-linecap="round"/>
  <path d="M475 320L463 312V328L475 320Z" fill="#CBC2B4"/>
  <path d="M840 320L828 312V328L840 320Z" fill="#CBC2B4"/>

  <rect x="120" y="470" width="960" height="120" rx="22" fill="#F4F0E7" stroke="#E1D8C8"/>
  <text x="160" y="524" fill="#171717" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="700">真正算跑通，不是服务活着，而是这条链路都顺了</text>
  <text x="160" y="564" fill="#5F5A51" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21">首页表单 → 后端校验 → Agent 规划 → 外部服务取数 → 结果页展示</text>
</svg>
