  <text x="204" y="681" fill="#5F5A51" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19">四块一接上，用户看到的就不再只是“生成了一段话”，而是一个能用、能改、能带走的结果。</text>
