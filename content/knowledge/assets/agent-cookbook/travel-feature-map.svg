  <text x="882" y="246" fill="#171717" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700">加载</text>

  <rect x="180" y="518" width="210" height="96" rx="22" fill="#FFFDF8" stroke="#D8CFBF" stroke-width="2"/>
  <text x="248" y="576" fill="#171717" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700">编辑</text>

  <rect x="820" y="518" width="210" height="96" rx="22" fill="#FFFDF8" stroke="#D8CFBF" stroke-width="2"/>
  <text x="882" y="576" fill="#171717" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700">导出</text>

  <path d="M390 284L520 338" stroke="#CBC2B4" stroke-width="4" stroke-linecap="round"/>
