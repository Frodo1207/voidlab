<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="720" fill="#F6F3EC"/>
  <rect x="48" y="40" width="1104" height="640" rx="28" fill="#FFFDF8" stroke="#E7E0D4" stroke-width="2"/>

  <text x="84" y="112" fill="#171717" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="36" font-weight="700">LLM 是大脑，Agent 让大脑指挥手脚</text>
  <text x="84" y="150" fill="#6B665C" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="22">关键不在“会想”，而在“能让动作发生”。中间需要结构化的指令，把想法翻译成可执行的动作。</text>

  <!-- Brain -->
  <rect x="84" y="220" width="320" height="200" rx="24" fill="#FFFDF8" stroke="#DDD4C6" stroke-width="2"/>
  <rect x="84" y="220" width="10" height="200" rx="5" fill="#C4F000"/>
  <text x="116" y="278" fill="#171717" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700">大脑（LLM）</text>
  <text x="116" y="314" fill="#5F5A51" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20">理解需求</text>
  <text x="116" y="344" fill="#5F5A51" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20">做出决策</text>
  <text x="116" y="374" fill="#5F5A51" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20">生成下一步</text>

  <!-- Instructions -->
  <rect x="444" y="220" width="312" height="200" rx="24" fill="#FAF7F0" stroke="#E1D8C8"/>
  <text x="476" y="278" fill="#171717" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700">结构化指令</text>
  <text x="476" y="314" fill="#5F5A51" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20">把想法写成</text>
  <text x="476" y="344" fill="#5F5A51" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20">可执行步骤 / 参数</text>
  <text x="476" y="374" fill="#5F5A51" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20">例如：调用哪个工具</text>

  <!-- Hands & legs -->
  <rect x="796" y="220" width="320" height="200" rx="24" fill="#FFFDF8" stroke="#DDD4C6" stroke-width="2"/>
  <rect x="796" y="220" width="10" height="200" rx="5" fill="#85C600"/>
  <text x="828" y="278" fill="#171717" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700">手和腿（执行）</text>
  <text x="828" y="314" fill="#5F5A51" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20">读/写文件</text>
  <text x="828" y="344" fill="#5F5A51" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20">发请求 / 查数据库</text>
  <text x="828" y="374" fill="#5F5A51" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20">生成产物 / 返回结果</text>

  <!-- External tools -->
  <rect x="84" y="468" width="1032" height="170" rx="22" fill="#F4F0E7" stroke="#E1D8C8"/>
  <text x="116" y="518" fill="#171717" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="700">工具（外部能力）</text>
  <text x="116" y="554" fill="#5F5A51" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20">浏览器 / 搜索 / API / 日历 / 邮件 / DB / 你自己的代码……</text>
  <text x="116" y="588" fill="#5F5A51" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20">Agent 的关键是：让大脑用清楚的格式“指挥工具怎么做”，并把结果接回上下文继续推进。</text>

  <!-- Connectors -->
  <path d="M404 320H444" stroke="#CBC2B4" stroke-width="4" stroke-linecap="round"/>
  <path d="M756 320H796" stroke="#CBC2B4" stroke-width="4" stroke-linecap="round"/>
  <path d="M600 420V468" stroke="#CBC2B4" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 10"/>
  <path d="M612 468L600 456L588 468" stroke="#CBC2B4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M444 320L432 312V328L444 320Z" fill="#CBC2B4"/>
  <path d="M796 320L784 312V328L796 320Z" fill="#CBC2B4"/>
</svg>
