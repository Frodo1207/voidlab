<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="720" fill="#F6F3EC"/>
  <rect x="48" y="40" width="1104" height="640" rx="28" fill="#FFFDF8" stroke="#E7E0D4" stroke-width="2"/>
  <text x="84" y="112" fill="#171717" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="36" font-weight="700">Agent = 用软件组装后的 LLM</text>
  <text x="84" y="150" fill="#6B665C" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="22">把“大脑”放进一个有目标、有工具、有状态、有输出的壳里，它才开始像一个系统。</text>

  <!-- Center brain -->
  <rect x="468" y="240" width="264" height="172" rx="24" fill="#FFFDF8" stroke="#DDD4C6" stroke-width="2"/>
  <rect x="468" y="240" width="10" height="172" rx="5" fill="#C4F000"/>
  <text x="502" y="302" fill="#171717" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700">LLM</text>
  <text x="502" y="338" fill="#5F5A51" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20">理解输入</text>
  <text x="502" y="368" fill="#5F5A51" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20">做出选择</text>
  <text x="502" y="398" fill="#5F5A51" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20">生成输出</text>

  <!-- Goal -->
  <rect x="84" y="220" width="270" height="120" rx="22" fill="#FAF7F0" stroke="#E1D8C8"/>
  <text x="116" y="266" fill="#171717" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">目标 / 任务</text>
  <text x="116" y="302" fill="#5F5A51" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20">你要它完成什么</text>

  <!-- State -->
  <rect x="84" y="380" width="270" height="120" rx="22" fill="#FAF7F0" stroke="#E1D8C8"/>
  <text x="116" y="426" fill="#171717" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">状态 / 记忆</text>
  <text x="116" y="462" fill="#5F5A51" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20">上下文、变量、进度</text>

  <!-- Tools -->
  <rect x="846" y="220" width="270" height="120" rx="22" fill="#FAF7F0" stroke="#E1D8C8"/>
  <text x="878" y="266" fill="#171717" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">工具</text>
  <text x="878" y="302" fill="#5F5A51" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20">搜索 / API / 文件 / DB</text>

  <!-- Output -->
  <rect x="846" y="380" width="270" height="120" rx="22" fill="#FAF7F0" stroke="#E1D8C8"/>
  <text x="878" y="426" fill="#171717" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">输出 / 交付</text>
  <text x="878" y="462" fill="#5F5A51" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20">结果要落到哪</text>

  <!-- Connectors -->
  <path d="M354 280H468" stroke="#CBC2B4" stroke-width="4" stroke-linecap="round"/>
  <path d="M354 440H468" stroke="#CBC2B4" stroke-width="4" stroke-linecap="round"/>
  <path d="M732 280H846" stroke="#CBC2B4" stroke-width="4" stroke-linecap="round"/>
  <path d="M732 440H846" stroke="#CBC2B4" stroke-width="4" stroke-linecap="round"/>
  <path d="M468 326H732" stroke="#CBC2B4" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 10"/>
  <path d="M468 352H732" stroke="#CBC2B4" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 10"/>

  <!-- Arrows -->
  <path d="M468 280L456 272V288L468 280Z" fill="#CBC2B4"/>
  <path d="M468 440L456 432V448L468 440Z" fill="#CBC2B4"/>
  <path d="M846 280L834 272V288L846 280Z" fill="#CBC2B4"/>
  <path d="M846 440L834 432V448L846 440Z" fill="#CBC2B4"/>

  <!-- Bottom note -->
  <rect x="84" y="554" width="1032" height="112" rx="18" fill="#F4F0E7" stroke="#E1D8C8"/>
  <text x="116" y="602" fill="#171717" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">一句话</text>
  <text x="200" y="602" fill="#5F5A51" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="22">LLM 负责“想”，Agent 负责把“想”变成能执行、能落地、能反复跑的流程。</text>
</svg>
