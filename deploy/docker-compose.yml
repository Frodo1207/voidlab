services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: voidlab-api:latest
    container_name: voidlab-api
    restart: unless-stopped
    environment:
      PORT: "${API_PORT:-8080}"
      APP_ENV: "${APP_ENV:-production}"
      DB_PATH: "${DB_PATH:-/app/data/sqlite/voidlab.db}"
      UPLOADS_DIR: "${UPLOADS_DIR:-/app/data/uploads}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:8080}"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:-http://minio:9000}"
      MINIO_BUCKET: "${MINIO_BUCKET:-voidlab-media}"
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ../data/sqlite:/app/data/sqlite
      - ../data/uploads:/app/data/uploads
    depends_on:
      - minio

  minio:
    image: docker.m.daocloud.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: voidlab-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ../data/minio:/data
